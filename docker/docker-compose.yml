services:
  documentserver:
    container_name: onlyoffice-document-server
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:latest}
    restart: always
    ports:
      - "${ONLYOFFICE_BIND_ADDRESS:-0.0.0.0}:${ONLYOFFICE_HTTP_PORT:-80}:80"
      - "${ONLYOFFICE_BIND_ADDRESS:-0.0.0.0}:${ONLYOFFICE_HTTPS_PORT:-443}:443"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Define ONLYOFFICE_JWT_SECRET en docker/.env}
    volumes:
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_data:/var/lib/onlyoffice
      - onlyoffice_lib:/var/www/onlyoffice/Data
      - onlyoffice_db:/var/lib/postgresql

volumes:
  onlyoffice_log:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:

    ## docker compose up -d
